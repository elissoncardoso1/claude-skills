; ESP32-2432S032C (CYD 3,2" ST7789 + GT911). Copie com User_Setup.h para a raiz do projeto.
[env:cyd32c]
platform  = espressif32
board     = esp32dev
framework = arduino
board_build.flash_mode  = dio
board_build.f_flash     = 80000000L
board_upload.flash_size = 4MB
board_build.partitions  = default.csv

upload_port   = /dev/cu.usbserial-11220
monitor_port  = /dev/cu.usbserial-11220
upload_speed  = 115200
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0

lib_deps = bodmer/TFT_eSPI@^2.5.43

build_flags =
    -D USER_SETUP_LOADED=1
    -include $PROJECT_DIR/User_Setup.h
